# El catálogo de plugins de Edita: compila y prueba las recetas con el Edita en desarrollo
# (el AppImage del release «continuous» de alktrip/edita), genera la lista y, si algo
# cambió, la firma y publica un release con los paquetes.
#
# Edita encuentra siempre la última lista en
#   https://github.com/alktrip/edita-plugins/releases/latest/download/plugins.json
# (y su firma en plugins.json.minisig). Los paquetes de cada lista están en su propio
# release, que no cambia.
#
# En los pull requests solo compila y prueba. Los lunes recompila con el Edita más
# reciente: si el SDK cambió, cambian los paquetes y se publica un catálogo nuevo.
name: Catálogo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write # para publicar los releases del catálogo

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

env:
  CC: gcc-12
  CXX: g++-12
  TZ: UTC
  QT_QPA_PLATFORM: offscreen

jobs:
  catalogo:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.lista.outputs.version }}
      tag: ${{ steps.lista.outputs.tag }}
      publish: ${{ steps.firma.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Paquetes
        # Compilar las recetas (con el Qt y el SDK del AppImage) y ejecutar Edita sin
        # pantalla
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 ninja-build pkg-config patch \
            python3-cryptography \
            libgl1 libegl1 libopengl0 libglx0 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0

      - name: Pruebas de los scripts
        run: /usr/bin/python3 -m unittest discover -s scripts -v

      - name: Edita
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/edita"
          cd "$RUNNER_TEMP/edita"
          gh release download continuous -R alktrip/edita -p '*.AppImage'
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          echo "EDITA=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "EDITA_SDK=$PWD/squashfs-root/usr/share/edita/plugin-sdk" >> "$GITHUB_ENV"
          echo "EDITA_APPIMAGE=$PWD/$(ls ./*.AppImage)" >> "$GITHUB_ENV"
          # El commit de Edita de ese AppImage: el release continuo cambia con cada push
          commit=$(gh api repos/alktrip/edita/git/ref/tags/continuous -q .object.sha)
          echo "EDITA_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Edita $commit, $(sha256sum ./*.AppImage)"

      - name: Compilar y probar las recetas
        run: scripts/build-all.sh "$EDITA" "$RUNNER_TEMP/paquetes"

      - name: Lista
        id: lista
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          tag="catalog-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          out="$RUNNER_TEMP/catalogo"
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/paquetes/*.zip "$RUNNER_TEMP"/paquetes/*.zip.sha256 "$out/"
          /usr/bin/python3 scripts/catalog.py pack-recipes --recipes recipes --out "$out/recipes.zip"
          /usr/bin/python3 scripts/catalog.py list --recipes recipes --packages "$out" --sdk "$EDITA_SDK" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$tag" \
            --catalog-version "$version" --recipes-zip "$out/recipes.zip" --out "$out/plugins.json"
          # ¿Cambió algo respecto al último catálogo publicado?
          gh release download -R "${{ github.repository }}" -p plugins.json -O "$RUNNER_TEMP/anterior.json" 2>/dev/null || true
          if /usr/bin/python3 scripts/catalog.py changed "$RUNNER_TEMP/anterior.json" "$out/plugins.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firmar
        id: firma
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.lista.outputs.changed == 'true'
        env:
          EDITA_CATALOG_KEY: ${{ secrets.EDITA_CATALOG_KEY }}
          VERSION: ${{ steps.lista.outputs.version }}
        run: |
          if [ -z "$EDITA_CATALOG_KEY" ]; then
            echo "::error::Falta el secreto EDITA_CATALOG_KEY (la clave de firma del catálogo): no se publica"
            exit 1
          fi
          out="$RUNNER_TEMP/catalogo"
          /usr/bin/python3 scripts/catalog.py sign "$out/plugins.json" \
            --trusted-comment "$(printf 'timestamp:%s\tfile:plugins.json\tcatalog:%s' "$(date -u +%s)" "$VERSION")"
          /usr/bin/python3 scripts/catalog.py verify --public keys/catalog.pub "$out/plugins.json"
          # Para reproducir los paquetes hace falta ese mismo AppImage: va en el release
          cp "$EDITA_APPIMAGE" "$out/"
          echo "Compilado con $(basename "$EDITA_APPIMAGE") (Edita $EDITA_COMMIT, SHA-256 $(sha256sum "$EDITA_APPIMAGE" | cut -d' ' -f1))" > "$out/edita.txt"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Subir el catálogo (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-linux-x86_64
          path: |
            ${{ runner.temp }}/catalogo
            ${{ runner.temp }}/paquetes/*.log
          if-no-files-found: error

  # Aparte, en Ubuntu 24.04 (la 22.04 no tiene minisign): la firma se comprueba con la
  # herramienta original antes de publicar
  publicar:
    needs: catalogo
    if: needs.catalogo.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalogo-linux-x86_64
          path: ${{ runner.temp }}/artefacto

      - name: Comprobar la firma
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign python3-cryptography
          out="$RUNNER_TEMP/artefacto/catalogo"
          minisign -Vm "$out/plugins.json" -p keys/catalog.pub
          /usr/bin/python3 scripts/catalog.py verify --public keys/catalog.pub "$out/plugins.json"
          # Cada paquete, con el SHA-256 de la lista
          /usr/bin/python3 - "$out" <<'PY'
          import hashlib, json, os, sys
          out = sys.argv[1]
          for p in json.load(open(os.path.join(out, "plugins.json")))["npp-plugins"]:
              if p["edita-build"] == "binary":
                  name = p["repository"].rsplit("/", 1)[1]
                  assert hashlib.sha256(open(os.path.join(out, name), "rb").read()).hexdigest() == p["id"], name
          PY

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.catalogo.outputs.version }}
          TAG: ${{ needs.catalogo.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/artefacto/catalogo"
          {
            echo "Catálogo de plugins de Edita para Linux x86_64. $(cat "$out/edita.txt")."
            echo
            echo "| Plugin | Versión | Licencia | Instalación |"
            echo "|---|---|---|---|"
            /usr/bin/python3 -c 'import json,sys
          for p in json.load(open(sys.argv[1]))["npp-plugins"]:
              how = "binario" if p["edita-build"] == "binary" else "se compila en el equipo"
              print("| %s | %s | %s | %s |" % (p["display-name"], p["version"], p["license"], how))' "$out/plugins.json"
            echo
            echo "Comprobar la firma: \`minisign -Vm plugins.json -p catalog.pub\` (la clave está en [keys/catalog.pub](https://github.com/${{ github.repository }}/blob/main/keys/catalog.pub))."
            echo
            echo "Comprobar un paquete: con el AppImage de este release, en Ubuntu 22.04 con GCC 12 (\`CC=gcc-12 CXX=g++-12\`), \`scripts/build-all.sh Edita-*.AppImage salida/\` da los mismos SHA-256 (los paquetes son reproducibles)."
          } > "$RUNNER_TEMP/notas.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Catálogo $VERSION" --latest \
            --notes-file "$RUNNER_TEMP/notas.md" \
            "$out"/*.zip "$out"/*.zip.sha256 "$out/plugins.json" "$out/plugins.json.minisig" "$out"/*.AppImage \
            keys/catalog.pub
